# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ✅ R8 Full Mode — AGP 8.7 default for release builds.
# Enables aggressive optimizations: class inlining, argument removal, etc.
# ProGuard rules in app/proguard-rules.pro protect Billing and other
# reflection-accessed classes from being stripped.
android.enableR8.fullMode=true

# ✅ Suppress the AGP 8.7.3 warning about compileSdk=36.
# AGP 8.7.3 was tested against SDK 35, but SDK 36 compiles correctly.
# Remove this line when upgrading to AGP 9.x+ which natively supports SDK 36.
android.suppressUnsupportedCompileSdk=36
